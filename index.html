<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özcanlar Turşu</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#1f7a3f;
color:white;
padding:30px;
text-align:center;
}

.products{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.product img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#1f7a3f;
font-size:22px;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>Özcanlar Turşu</h1>

<p>Doğal Ev Yapımı Çubuk Turşuları</p>

</header>

<div class="products" id="products"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAp62PwdCob_bNQyFoM1QUcyUJD8gGb_ZE",
  authDomain: "tursu-site.firebaseapp.com",
  projectId: "tursu-site",
  storageBucket: "tursu-site.firebasestorage.app",
  messagingSenderId: "899552129386",
  appId: "1:899552129386:web:f9f88341a60bd04610b513",
  measurementId: "G-3V3PDMT0PB"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const productsDiv = document.getElementById("products");

db.collection("products").get().then((querySnapshot)=>{

querySnapshot.forEach((doc)=>{

const p = doc.data();

productsDiv.innerHTML += `

<div class="product">

<img src="${p.image}" alt="">

<h2>${p.name}</h2>

<p>${p.description}</p>

<div class="price">${p.price} TL</div>

</div>

`;

});

});

</script>

</body>
</html>
